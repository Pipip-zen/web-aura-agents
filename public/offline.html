<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4648d4" />
    <title>Aura Agent Offline</title>
    <style>
      body {
        align-items: center;
        background: linear-gradient(180deg, #f9f9ff 0%, #eef3ff 100%);
        color: #111c2d;
        display: flex;
        font-family: Inter, system-ui, sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }
      main {
        background: rgba(255, 255, 255, 0.82);
        border: 1px solid #c7c4d7;
        border-radius: 18px;
        box-shadow: 0 20px 50px rgba(70, 72, 212, 0.14);
        max-width: 420px;
        padding: 24px;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 8px;
      }
      p {
        color: #464554;
        line-height: 1.55;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Anda sedang offline</h1>
      <p>Aura Agent tetap bisa dibuka, tetapi data klaim terbaru membutuhkan koneksi internet. Sambungkan kembali internet Anda, lalu buka ulang aplikasi.</p>
    </main>
  </body>
</html>
